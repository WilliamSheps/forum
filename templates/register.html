{% extends "base.html" %} {% block title %}Skapa konto{% endblock %} {% block
content %}
<h2>Skapa konto</h2>

{% if error %}
<p style="color: red">{{ error }}</p>
{% endif %} {% if success %}
<p style="color: green">Kontot är nu skapat.</p>
{% endif %}

<form method="post" autocomplete="off">
  <label
    >Användarnamn <input name="username" autocomplete="off" required /></label
  ><br />
  <label>Namn <input name="display_name" autocomplete="off" required /></label
  ><br />
  <label
    >Lösenord
    <input
      type="password"
      name="password"
      autocomplete="new-password"
      required /></label
  ><br />
  <button>Skapa konto</button>
</form>
{% endblock %}
